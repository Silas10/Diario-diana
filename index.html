
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diário da Diana</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #f4f6f1;
    font-family: Arial, sans-serif;
    color: #26352d;
}

.container {
    max-width: 500px;
    margin: 35px auto;
}

header {
    background: white;
    padding: 25px;
    border-radius: 15px;
    margin-bottom: 20px;
    text-align: center;
}

header h1 {
    margin: 0 0 10px;
    font-size: 27px;
}

header p {
    margin: 0;
    color: #718078;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 2px 10px #0000000a;
}

h2 {
    margin-top: 0;
    text-align: center;
}

.users {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin-top: 25px;
}

.user-button {
    background: #f0f5f1;
    color: #315a43;
    border: 2px solid #e0e9e2;
    border-radius: 12px;
    padding: 25px 10px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: .2s;
}

.user-button:hover {
    background: #dcebe0;
    border-color: #477c64;
}

.avatar {
    display: block;
    font-size: 40px;
    margin-bottom: 12px;
}

#dashboard {
    display: none;
}

.welcome {
    text-align: center;
    padding: 15px 0;
}

.welcome h2 {
    color: #477c64;
}

.secondary {
    background: #e9f0eb;
    color: #315a43;
    border: none;
    padding: 13px;
    border-radius: 8px;
    width: 100%;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 20px;
}

#userName {
    font-weight: bold;
}

</style>
</head>

<body>

<div class="container">

<header>
    <h1>📖 Diário da Diana</h1>
    <p>Registro alimentar e intestinal da Diana ❤️</p>
</header>

<!-- ESCOLHA DO USUÁRIO -->

<div class="card" id="selection">

    <h2>Quem está acessando?</h2>

    <div class="users">

        <button class="user-button" onclick="selectUser('Silas')">
            <span class="avatar">👨</span>
            Silas
        </button>

        <button class="user-button" onclick="selectUser('Flávia')">
            <span class="avatar">👩</span>
            Flávia
        </button>

    </div>

</div>

<!-- PAINEL PRINCIPAL -->

<div class="card" id="dashboard">

    <div class="welcome">

        <div style="font-size:50px;">❤️</div>

        <h2>Bem-vindo ao Diário da Diana!</h2>

        <p>
            Olá, <span id="userName"></span>!
        </p>

        <p>
            Você está acessando o diário da Diana.
        </p>

    </div>

    <button class="secondary" onclick="changeUser()">
        Trocar usuário
    </button>

</div>

</div>

<script>

// CONFIGURAÇÃO SUPABASE

const SUPABASE_URL =
"https://usjfxujtvzsyccuplwtv.supabase.co";

const SUPABASE_KEY =
"sb_publishable_nwGlDWcWFP2-uFH50_ZZLA_UklPEf7M";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

// ELEMENTOS

const selection = document.getElementById("selection");
const dashboard = document.getElementById("dashboard");
const userName = document.getElementById("userName");

// SELECIONAR USUÁRIO

function selectUser(name) {

    if (name !== "Silas" && name !== "Flávia") {
        return;
    }

    localStorage.setItem("diario_usuario", name);

    showDashboard(name);
}

// MOSTRAR PAINEL

function showDashboard(name) {

    selection.style.display = "none";
    dashboard.style.display = "block";

    userName.textContent = name;

}

// TROCAR USUÁRIO

function changeUser() {

    localStorage.removeItem("diario_usuario");

    dashboard.style.display = "none";
    selection.style.display = "block";

}

// VERIFICAR ÚLTIMO USUÁRIO

function checkUser() {

    const savedUser = localStorage.getItem("diario_usuario");

    if (savedUser === "Silas" || savedUser === "Flávia") {
        showDashboard(savedUser);
    }

}

// INICIALIZAÇÃO

checkUser();

</script>

</body>
</html>
