<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diário da Diana</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;padding:16px;background:#f4f6f1;font-family:Arial,sans-serif;color:#26352d}
.container{max-width:600px;margin:20px auto}header,.card{background:white;padding:22px;border-radius:15px;margin-bottom:18px;box-shadow:0 2px 10px #00000008}
header{text-align:center}header h1{margin:0 0 8px}header p{color:#718078;margin:0}h2{margin-top:0}
button,input,select,textarea{width:100%;padding:13px;margin:7px 0;border-radius:8px;font-size:15px}
input,select,textarea{border:1px solid #d5ddd7;background:white;color:#26352d}textarea{min-height:85px;resize:vertical}
button{border:0;background:#477c64;color:white;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}
.secondary{background:#e9f0eb;color:#315a43}.danger{background:#a44d4d}
.users{display:grid;grid-template-columns:1fr 1fr;gap:12px}.user-button{background:#e9f0eb;color:#315a43;padding:25px 10px;font-size:18px}
.user-button span{display:block;font-size:35px;margin-bottom:8px}#dashboard{display:none}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:15px}.tabs button{background:#e9f0eb;color:#315a43}.tabs button.active{background:#477c64;color:white}
.entry{border-left:4px solid #477c64;padding:12px;margin:12px 0;background:#f5f8f5;border-radius:8px;overflow-wrap:anywhere}
.entry h3{margin:0 0 8px}.entry small{color:#718078}.entry p{margin:7px 0}.entry button{padding:8px;font-size:13px}
#message{display:none;padding:12px;border-radius:8px;margin-bottom:12px;overflow-wrap:anywhere}
label{display:block;font-weight:bold;margin-top:12px;font-size:14px}.user-info{color:#477c64;font-weight:bold;text-align:center}.hidden{display:none}
.report-period{display:grid;grid-template-columns:1fr 1fr;gap:10px}.report-info{font-size:13px;color:#718078;line-height:1.5}
@media(max-width:380px){.report-period{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
<header><h1>📖 Diário da Diana</h1><p>Registro alimentar e intestinal ❤️</p></header>
<div id="selection" class="card">
<h2 style="text-align:center">Quem está acessando?</h2>
<div class="users">
<button class="user-button" onclick="selectUser('Silas')"><span>👨</span>Silas</button>
<button class="user-button" onclick="selectUser('Flávia')"><span>👩</span>Flávia</button>
</div></div>
<div id="dashboard">
<div class="card"><p class="user-info">Diário da Diana · <span id="userName"></span></p><button class="secondary" onclick="changeUser()">Trocar usuário</button></div>
<div class="card">
<h2>📝 Novo registro</h2>
<div class="tabs">
<button id="foodTab" class="active" type="button" onclick="changeType('food')">🍎 Alimentação</button>
<button id="stoolTab" type="button" onclick="changeType('stool')">💩 Evacuação</button>
</div>
<div id="message"></div>
<form id="entryForm">
<label>Data</label><input type="date" id="entryDate" required>
<label>Horário</label><input type="time" id="entryTime" required>
<div id="foodFields">
<label>Tipo de refeição</label><select id="mealType">
<option>Café da manhã</option><option>Lanche da manhã</option><option>Almoço</option><option>Lanche da tarde</option><option>Jantar</option><option>Ceia</option><option>Mamadeira</option><option>Outro</option></select>
<label>Alimentos consumidos</label><textarea id="foodDescription" placeholder="Ex: arroz, feijão, frango e cenoura"></textarea>
<label>Quantidade aproximada</label><input id="foodQuantity" placeholder="Ex: 3 colheres, 150 ml">
</div>
<div id="stoolFields" class="hidden">
<label>Consistência das fezes</label><select id="consistency"><option>Formadas</option><option>Pastosas</option><option>Líquidas</option><option>Duras</option><option>Ressecadas / bolinhas</option></select>
<label>Cor</label><select id="stoolColor"><option>Marrom</option><option>Amarelada</option><option>Esverdeada</option><option>Clara</option><option>Escura</option><option>Avermelhada</option><option>Outra</option></select>
<label>Quantidade</label><select id="stoolQuantity"><option>Pequena</option><option selected>Média</option><option>Grande</option></select>
<label>Muco ou sangue?</label><select id="symptoms"><option>Nenhum</option><option>Muco</option><option>Sangue</option><option>Muco e sangue</option></select>
</div>
<label>Observações</label><textarea id="notes" placeholder="Outras informações importantes..."></textarea>
<button type="submit" id="saveButton">Salvar registro</button>
</form></div>
<div class="card">
<h2>📊 Relatório da Diana</h2>
<p class="report-info">Selecione o período. O relatório reúne os registros de Silas e Flávia e permite imprimir ou salvar em PDF.</p>
<div class="report-period">
<div><label for="reportStart">Data inicial</label><input type="date" id="reportStart"></div>
<div><label for="reportEnd">Data final</label><input type="date" id="reportEnd"></div>
</div>
<button id="generateReportButton" type="button" onclick="generateReport()">📄 Gerar relatório</button>
<div id="reportMessage" class="report-info" aria-live="polite"></div>
</div>
<div class="card"><h2>📚 Histórico</h2><button class="secondary" type="button" onclick="loadEntries()">🔄 Atualizar histórico</button><div id="history">Carregando registros...</div></div>
</div></div>

<script>
const SUPABASE_URL="https://usjfxujtvzsyccuplwtv.supabase.co";
const SUPABASE_KEY="sb_publishable_nwGlDWcWFP2-uFH50_ZZLA_UklPEf7M";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser=null,currentType="food";
const selection=document.getElementById("selection"),dashboard=document.getElementById("dashboard");
const foodFields=document.getElementById("foodFields"),stoolFields=document.getElementById("stoolFields");
const historyEl=document.getElementById("history");

function localDateString(date=new Date()){const d=new Date(date.getTime()-date.getTimezoneOffset()*60000);return d.toISOString().slice(0,10)}
function setDateTime(){const now=new Date(),today=localDateString(now);document.getElementById("entryDate").value=today;document.getElementById("entryTime").value=now.toTimeString().slice(0,5);document.getElementById("reportStart").value=today.slice(0,8)+"01";document.getElementById("reportEnd").value=today}
function selectUser(name){currentUser=name;localStorage.setItem("diario_usuario",name);document.getElementById("userName").textContent=name;selection.style.display="none";dashboard.style.display="block";setDateTime();loadEntries()}
function changeUser(){currentUser=null;localStorage.removeItem("diario_usuario");dashboard.style.display="none";selection.style.display="block"}
function changeType(type){currentType=type;foodFields.classList.toggle("hidden",type!=="food");stoolFields.classList.toggle("hidden",type!=="stool");document.getElementById("foodTab").classList.toggle("active",type==="food");document.getElementById("stoolTab").classList.toggle("active",type==="stool")}
function showMessage(text,success=false){const box=document.getElementById("message");box.style.display="block";box.style.background=success?"#e0f3e5":"#ffe5e5";box.style.color=success?"#245d36":"#9b2525";box.textContent=text}
function escapeHTML(value){return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function formatDate(date){if(!date)return "-";const p=String(date).split("-");return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:date}

document.getElementById("entryForm").addEventListener("submit",async event=>{
event.preventDefault();if(!currentUser)return;
const button=document.getElementById("saveButton");button.disabled=true;button.textContent="Salvando...";
const record={
created_by:currentUser,entry_date:document.getElementById("entryDate").value,entry_time:document.getElementById("entryTime").value,type:currentType,
meal_type:currentType==="food"?document.getElementById("mealType").value:null,
description:currentType==="food"?document.getElementById("foodDescription").value:null,
quantity:currentType==="food"?document.getElementById("foodQuantity").value:document.getElementById("stoolQuantity").value,
consistency:currentType==="stool"?document.getElementById("consistency").value:null,
color:currentType==="stool"?document.getElementById("stoolColor").value:null,
symptoms:currentType==="stool"?document.getElementById("symptoms").value:null,notes:document.getElementById("notes").value};
try{const {error}=await db.from("diary_entries").insert(record);if(error)throw error;showMessage("Registro salvo com sucesso! ❤️",true);document.getElementById("entryForm").reset();setDateTime();await loadEntries()}
catch(error){showMessage("Erro ao salvar: "+error.message)}
finally{button.disabled=false;button.textContent="Salvar registro"}
});

async function loadEntries(){
historyEl.textContent="Carregando...";
try{const {data,error}=await db.from("diary_entries").select("*").order("entry_date",{ascending:false}).order("entry_time",{ascending:false}).limit(100);if(error)throw error;
if(!data?.length){historyEl.textContent="Nenhum registro realizado ainda.";return}
historyEl.innerHTML=data.map(item=>{const food=item.type==="food";return `<div class="entry"><h3>${food?"🍎 Alimentação":"💩 Evacuação"}</h3><small>${escapeHTML(formatDate(item.entry_date))} às ${escapeHTML(item.entry_time)} · Por ${escapeHTML(item.created_by)}</small>
${food?`<p><b>Refeição:</b> ${escapeHTML(item.meal_type)}</p><p><b>Alimentos:</b> ${escapeHTML(item.description)}</p><p><b>Quantidade:</b> ${escapeHTML(item.quantity)}</p>`:`<p><b>Consistência:</b> ${escapeHTML(item.consistency)}</p><p><b>Cor:</b> ${escapeHTML(item.color)}</p><p><b>Quantidade:</b> ${escapeHTML(item.quantity)}</p><p><b>Muco/sangue:</b> ${escapeHTML(item.symptoms)}</p>`}
${item.notes?`<p><b>Observações:</b> ${escapeHTML(item.notes)}</p>`:""}<button class="danger" onclick="deleteEntry('${String(item.id).replace(/'/g,"\\'")}')">Excluir registro</button></div>`}).join("")}
catch(error){historyEl.textContent="Erro ao carregar: "+error.message}
}

async function fetchAllEntries(start,end){
const all=[],size=500;
for(let from=0;;from+=size){const {data,error}=await db.from("diary_entries").select("*").gte("entry_date",start).lte("entry_date",end).order("entry_date",{ascending:true}).order("entry_time",{ascending:true}).range(from,from+size-1);if(error)throw error;if(!data?.length)break;all.push(...data);if(data.length<size)break}
return all;
}

async function generateReport(){
const start=document.getElementById("reportStart").value,end=document.getElementById("reportEnd").value;
const button=document.getElementById("generateReportButton"),status=document.getElementById("reportMessage");
if(!currentUser){status.textContent="Selecione um usuário primeiro.";return}
if(!start||!end){status.textContent="Informe a data inicial e a data final.";return}
if(start>end){status.textContent="A data inicial não pode ser posterior à data final.";return}
button.disabled=true;button.textContent="Consultando registros...";status.textContent="";
try{
const data=await fetchAllEntries(start,end);
if(!data.length){status.textContent="Nenhum registro encontrado nesse período.";return}
const foods=data.filter(x=>x.type==="food"),stools=data.filter(x=>x.type==="stool");
const records=data.map(item=>{const food=item.type==="food";return `<article class="record"><h3>${food?"🍎 Alimentação":"💩 Evacuação"}</h3>
<p><b>Data e horário:</b> ${escapeHTML(formatDate(item.entry_date))} às ${escapeHTML(item.entry_time)}</p><p><b>Responsável:</b> ${escapeHTML(item.created_by)}</p>
${food?`<p><b>Refeição:</b> ${escapeHTML(item.meal_type)}</p><p><b>Alimentos:</b> ${escapeHTML(item.description)}</p><p><b>Quantidade:</b> ${escapeHTML(item.quantity)}</p>`:`<p><b>Consistência:</b> ${escapeHTML(item.consistency)}</p><p><b>Cor:</b> ${escapeHTML(item.color)}</p><p><b>Quantidade:</b> ${escapeHTML(item.quantity)}</p><p><b>Muco/sangue:</b> ${escapeHTML(item.symptoms)}</p>`}
${item.notes?`<p><b>Observações:</b> ${escapeHTML(item.notes)}</p>`:""}</article>`}).join("");
const report=`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relatório - Diário da Diana</title>
<style>body{font-family:Arial,sans-serif;color:#26352d;max-width:850px;margin:25px auto;padding:0 18px;line-height:1.45}h1,h2{text-align:center}.summary{background:#e9f0eb;padding:16px;border-radius:9px;margin:22px 0}.record{border:1px solid #d5ddd7;border-left:4px solid #477c64;border-radius:8px;padding:12px 16px;margin:14px 0;break-inside:avoid}.record h3{margin:0 0 8px;color:#315a43}.record p{margin:5px 0}.print{display:block;width:100%;padding:14px;border:0;border-radius:8px;background:#477c64;color:white;font-size:16px;font-weight:bold;margin:0 0 22px}@media print{body{margin:0;max-width:none}.print{display:none}.record{break-inside:avoid}}</style></head><body>
<button class="print" onclick="window.print()">🖨️ Imprimir / Salvar como PDF</button><h1>📖 Diário da Diana</h1><h2>Relatório alimentar e intestinal</h2>
<div class="summary"><p><b>Período:</b> ${formatDate(start)} a ${formatDate(end)}</p><p><b>Total de registros:</b> ${data.length}</p><p><b>Alimentação:</b> ${foods.length}</p><p><b>Evacuações:</b> ${stools.length}</p><p><b>Registros de Silas:</b> ${data.filter(x=>x.created_by==="Silas").length}</p><p><b>Registros de Flávia:</b> ${data.filter(x=>x.created_by==="Flávia").length}</p></div>
<h2>Registros do período</h2>${records}<p style="text-align:center;margin-top:30px;font-size:12px">Relatório gerado em ${new Date().toLocaleString("pt-BR")}</p></body></html>`;
const blob=new Blob([report],{type:"text/html;charset=utf-8"}),url=URL.createObjectURL(blob),link=document.createElement("a");
link.href=url;link.target="_blank";link.rel="noopener";link.click();setTimeout(()=>URL.revokeObjectURL(url),60000);
status.textContent="Relatório preparado. Na página aberta, toque em “Imprimir / Salvar como PDF”.";
}catch(error){console.error(error);status.textContent="Erro ao gerar relatório: "+error.message}
finally{button.disabled=false;button.textContent="📄 Gerar relatório"}
}

async function deleteEntry(id){if(!confirm("Deseja excluir este registro?"))return;const {error}=await db.from("diary_entries").delete().eq("id",id);if(error){alert("Erro ao excluir: "+error.message);return}loadEntries()}
function initialize(){const saved=localStorage.getItem("diario_usuario");if(saved==="Silas"||saved==="Flávia")selectUser(saved)}
initialize();
</script>
</body>
</html>
